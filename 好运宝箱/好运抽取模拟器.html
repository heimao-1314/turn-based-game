.app{width:min(520px,100%);margin:0 auto;padding:24px 18px 34px;transition:width .25s ease}
.app.rewards-open{width:min(1180px,100%)}
.shell{border:1px solid var(--line);background:linear-gradient(145deg,rgba(29,37,32,.96),rgba(7,12,12,.96));box-shadow:0 24px 70px #0009, inset 0 0 0 2px #0008;padding:12px}
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border:1px solid var(--line);background:linear-gradient(180deg,#27342b,#101918);box-shadow:inset 0 0 0 2px #e9b86b18}
.kicker{font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
h1{margin:4px 0 0;font-size:26px;letter-spacing:.08em;color:#fff;text-shadow:2px 2px #26180e}
.subtitle{margin:4px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{min-width:98px;padding:8px 11px;border:1px solid #efd08355;background:#091111;color:var(--muted);font-size:12px;text-align:center}
.stat strong{display:block;color:var(--gold2);font-size:18px;margin-top:2px}
.layout{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.app.rewards-open .layout{grid-template-columns:minmax(330px,430px) minmax(0,1fr)}
.panel{border:1px solid var(--line);background:var(--panel);box-shadow:inset 0 0 0 2px #0006}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);color:var(--gold2);font-size:14px;font-weight:800}
.panel-head small{color:var(--muted);font-size:11px;font-weight:400}
.draw-panel{padding-bottom:12px}
.roll-title{padding:20px 14px 6px;text-align:center;color:#fff;font-weight:800;letter-spacing:.12em}
.roll-title:before,.roll-title:after{content:"✦";color:var(--gold);margin:0 12px}
.roll-stage{margin:0 12px;padding:8px;border:1px solid #f1c67d33;background:#080e0f;min-height:155px;display:grid;gap:4px;align-content:center}
.roll-row{display:flex;justify-content:center;align-items:center;gap:7px;min-height:39px;padding:7px 10px;border:1px solid transparent;color:#f4e4c0;font-size:14px;white-space:nowrap;overflow:hidden}
.roll-row.target{background:linear-gradient(90deg,#775b32,#cba361,#775b32);border-color:#ffe8ae;box-shadow:inset 0 0 0 2px #462512;color:#fff;text-shadow:1px 1px #45250f;font-weight:800}
.roll-row span:last-child{overflow:hidden;text-overflow:ellipsis}
.icon{display:inline-block;flex:0 0 24px;width:24px;height:24px;background-repeat:no-repeat;image-rendering:pixelated}

.action:hover{filter:brightness(1.16)}.action:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px #fff2b822}
.action.secondary{background:#111d1c;color:#d5c9aa}
.notice{min-height:23px;padding:9px 14px 0;text-align:center;color:#d8ca9f;font-size:12px}
.history{margin:12px;border-top:1px solid #efd08333;padding-top:9px}
.history h3{margin:0 0 6px;font-size:12px;color:var(--gold)}
.log{display:grid;gap:4px;max-height:110px;overflow:auto;font-size:12px;color:#cfc3a1}
.log div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #ffffff13;padding:3px 0}.log b{color:#fff1b8;font-weight:600}
.reward-panel{min-height:520px;display:none;flex-direction:column}
.app.rewards-open .reward-panel{display:flex}
.reward-toggle{width:100%;margin-top:10px}
.reward-list{padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;overflow:auto;max-height:560px}
.reward{display:grid;grid-template-columns:25px minmax(0,1fr) auto;align-items:center;gap:6px;padding:7px 8px;border:1px solid transparent;background:#091111;color:#eee0bd;font-size:12px}
.reward:hover{border-color:#f1c67d55;background:#17221e}.reward-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reward-meta{color:#bcae8c;font-size:11px;text-align:right}.reward-meta b{display:block;color:#e9c978}
.reward.hit{animation:flash .8s ease}
@keyframes flash{0%,100%{background:#091111}40%{background:#a47c39;color:#fff}}
.action{background-image:var(--button-bg);background-size:100% 100%;background-repeat:no-repeat}
.shell,.header,.panel,.roll-stage{position:relative}
.shell:before,.header:before,.panel:before,.roll-stage:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background-image:var(--edge-h-bg),var(--edge-h-bg),var(--edge-v-bg),var(--edge-v-bg);background-position:center top,center bottom,left center,right center;background-size:auto 3px,auto 3px,3px auto,3px auto;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y}
.frame-corners{position:absolute;inset:0;z-index:4;pointer-events:none}
.frame-corner{position:absolute;width:7px;height:7px;background:var(--corner-bg) 0 0/7px 7px no-repeat}
.frame-corner.tl{left:0;top:0}.frame-corner.tr{right:0;top:0;transform:scaleX(-1)}.frame-corner.bl{left:0;bottom:0;transform:scaleY(-1)}.frame-corner.br{right:0;bottom:0;transform:scale(-1,-1)}
.footer{padding-top:12px;text-align:center;color:#8e846e;font-size:11px}
@media(max-width:800px){.app,.app.rewards-open{width:100%}.layout,.app.rewards-open .layout{grid-template-columns:1fr}.reward-panel{min-height:0}.reward-list{max-height:420px}.header{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}.reward-list{grid-template-columns:1fr}}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]})}
function icon(item){const c=item.icon||""; if(c==="lucky:skill")return '<i class="icon skill" aria-hidden="true"></i>'; const p=c.split(":"); if(p[0]!=="lucky")return '<i class="icon sheet1 i-1-13"></i>'; const sheet=p[1]==="2"?"sheet2":"sheet1"; const pos=p[1]+"-"+(p[2]||"13"); return '<i class="icon '+sheet+' i-'+pos+'" aria-hidden="true"></i>'}
function colorSpan(text,color){return '<span style="color:'+color+'">'+esc(text)+'</span>'}
function rainbow(text,colors){return Array.from(text).map(function(ch,i){return colorSpan(ch,colors[i%colors.length])}).join("")}
function coloredName(item){const name=item.name;const c=(item.icon||"").split(":");if(item.icon==="lucky:skill"){const m=name.match(/^([A-Z]+)圣技·(.+?)·(宠物技能卡)$/);if(m)return colorSpan(m[1],"#FFFFFF")+colorSpan("圣技·","#00FFFF")+colorSpan(m[2],"#FFFF00")+colorSpan("·"+m[3],"#00FF66")}if(c[1]==="1"&&c[2]==="13")return colorSpan(name,"#FFAA00");if(c[1]==="1"&&c[2]==="19")return colorSpan(name,"#FFFFFF");if(c[1]==="1"&&c[2]==="last"){if(name==="圣品启魂书"||name==="完美启魂书")return rainbow(name,["#FFFF00","#00FF66","#00FFFF","#FF3333","#FFAA00"]);return colorSpan(name,"#FFAA00")}if(c[1]==="2"&&c[2]==="6"){if(name==="珍奇宠物召唤券")return rainbow(name,["#FFFF00","#00FF66","#00FFFF","#FF3333","#FFAA00","#FFFF00","#FF66CC"]);return colorSpan(name,"#FFAA00")}if(c[1]==="2")return colorSpan(name,"#00FFFF");return colorSpan(name,"#FFFFFF")}
function label(item){return icon(item)+'<span class="colored-name">'+coloredName(item)+'</span>'}
function weighted(){let n=Math.random()*totalWeight;for(const item of rewards){n-=item.probability;if(n<=0)return item}return rewards[rewards.length-1]}
function renderStats(){document.getElementById("yuanbao").textContent=state.yuanbao;document.getElementById("draws").textContent=state.draws;document.getElementById("value").textContent=state.value}
function renderList(){document.getElementById("rewardList").innerHTML=rewards.map(function(r){return '<div class="reward" data-id="'+r.id+'">'+icon(r)+'<span class="reward-name" title="'+esc(r.name)+'">'+coloredName(r)+'</span><span class="reward-meta"><b>'+r.probability+'%</b>价值 '+r.value+'</span></div>'}).join("")}
function row(item,target){return '<div class="roll-row'+(target?" target":"")+'">'+label(item)+'</div>'}
function showRows(items,targetIndex){stage.innerHTML=items.map(function(item,i){return row(item,i===targetIndex)}).join("");addFrameCorners()}
function addLog(items){const list=Array.isArray(items)?items:[items];state.history=list.concat(state.history).slice(0,20);log.innerHTML=state.history.map(function(r){return '<div><b>'+coloredName(r)+'</b><span>价值 '+r.value+'</span></div>'}).join("")}
function finish(results){const last=results[results.length-1];state.draws+=results.length;state.value+=results.reduce((s,r)=>s+r.value,0);addLog(results);renderStats();document.querySelectorAll(".reward").forEach(function(el){el.classList.toggle("hit",results.some(function(r){return r.id===el.dataset.id}))});notice.textContent=results.length===1?"获得："+last.name+" ×1":"本次获得 "+results.length+" 件奖励，已全部记录";setTimeout(function(){document.querySelectorAll(".reward.hit").forEach(function(el){el.classList.remove("hit")})},900)}
function draw(count){if(state.rolling)return;const cost=count*40;if(state.yuanbao<cost){notice.textContent="元宝不足，请点击“补充 400 元宝”";return}state.yuanbao-=cost;renderStats();state.rolling=true;document.querySelectorAll(".action").forEach(function(b){b.disabled=true});const results=[];for(let i=0;i<count;i++)results.push(weighted());let ticks=0;const total=count===1?15:9;const timer=setInterval(function(){const fake=[weighted(),weighted(),weighted()];fake[1]=ticks>=total-2?results[0]:fake[1];showRows(fake,1);ticks++;if(ticks>=total){clearInterval(timer);const final=results[0];showRows([weighted(),final,weighted()],1);state.rolling=false;document.querySelectorAll(".action").forEach(function(b){b.disabled=false});finish(results)}},count===1?70:95)}
document.getElementById("drawOne").onclick=function(){draw(1)};document.getElementById("drawTen").onclick=function(){draw(10)};
const app=document.querySelector(".app"),toggleRewards=document.getElementById("toggleRewards");
toggleRewards.onclick=function(){const open=app.classList.toggle("rewards-open");toggleRewards.textContent=open?"收起奖励列表":"显示奖励列表";toggleRewards.setAttribute("aria-expanded",String(open))};
document.getElementById("reset").onclick=function(){if(state.rolling)return;state.yuanbao=400;state.draws=0;state.value=0;state.history=[];renderStats();log.innerHTML='<div><span>尚未有抽取记录</span><span>—</span></div>';notice.textContent="模拟已重置";showRows([rewards[0],rewards[1],rewards[2]],1)};
document.getElementById("fill").onclick=function(){state.yuanbao+=400;renderStats();notice.textContent="已补充 400 元宝"};
function addFrameCorners(){document.querySelectorAll(".shell,.header,.panel,.roll-stage").forEach(function(el){if(el.querySelector(".frame-corners"))return;const corners=document.createElement("span");corners.className="frame-corners";corners.innerHTML='<i class="frame-corner tl"></i><i class="frame-corner tr"></i><i class="frame-corner bl"></i><i class="frame-corner br"></i>';el.appendChild(corners)})}
